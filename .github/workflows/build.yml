# Builds both apps: Android (APK) and Windows (portable zip).
# Every push and pull request is a test build (files under the run's Artifacts).
# When main gets a version in package.json that has no Release yet, the Release
# (tag v<version>, both files, notes from CHANGELOG.md) is published automatically.
name: Build apps
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    tags: ['v*']
  pull_request: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build

      - name: Android APK
        run: |
          npx cap add android
          npx cap sync android
          chmod +x android/gradlew
          (cd android && ./gradlew assembleDebug)
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/NGH-Companion.apk

      - name: Windows app
        run: |
          ./desktop/build.sh
          cp desktop/out/NGH-Companion-Windows.zip release/

      - uses: actions/upload-artifact@v5
        with:
          name: NGH-Companion
          path: release/

      - name: Publish release for a new version
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          if gh release view "$V" >/dev/null 2>&1; then
            echo "Release $V already exists; nothing to publish."
          else
            gh release create "$V" release/NGH-Companion.apk release/NGH-Companion-Windows.zip \
              --target "$GITHUB_SHA" \
              --title "NGH Companion $V" \
              --notes-file CHANGELOG.md \
              --latest
          fi
