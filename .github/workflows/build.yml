# Builds both apps: Android (APK) and Windows (portable zip).
# Every push and pull request is a test build (files under the run's Artifacts).
# When main gets a version in package.json that has no Release yet, the Release
# (tag v<version>, both files, notes from CHANGELOG.md) is published automatically.
name: Build apps
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    tags: ['v*']
  pull_request: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build

      - name: Android APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          npx cap add android
          npx cap sync android
          # Every build gets a higher versionCode so Android accepts it as an update.
          VERSION=$(node -p "require('./package.json').version")
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          chmod +x android/gradlew
          mkdir -p release
          if [ -n "$KEYSTORE_B64" ]; then
            # Signed with the project's permanent key: new versions install over old ones and keep the data.
            (cd android && ./gradlew assembleRelease)
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ngh.p12"
            "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/ngh.p12" --ks-type PKCS12 --ks-key-alias ngh \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
              --out release/NGH-Companion.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify --print-certs release/NGH-Companion.apk | head -3
            rm -f "$RUNNER_TEMP/ngh.p12"
          else
            # No signing key (forks, pull requests): a debug build for testing only.
            (cd android && ./gradlew assembleDebug)
            cp android/app/build/outputs/apk/debug/app-debug.apk release/NGH-Companion.apk
          fi

      - name: Windows app
        run: |
          ./desktop/build.sh
          cp desktop/out/NGH-Companion-Windows.zip release/

      - uses: actions/upload-artifact@v5
        with:
          name: NGH-Companion
          path: release/

      - name: Publish release for a new version
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          if gh release view "$V" >/dev/null 2>&1; then
            echo "Release $V already exists; nothing to publish."
          else
            gh release create "$V" release/NGH-Companion.apk release/NGH-Companion-Windows.zip \
              --target "$GITHUB_SHA" \
              --title "NGH Companion $V" \
              --notes-file CHANGELOG.md \
              --latest
          fi
