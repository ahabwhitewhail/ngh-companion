# Builds the Android APK in the cloud and publishes it as a GitHub Release.
# Runs on every push to main, or by hand: Actions → "Android APK" → Run workflow.
name: Android APK
on:
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk NGH-Companion.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" NGH-Companion.apk \
            --title "NGH Companion · build ${{ github.run_number }}" \
            --notes "Android APK built from ${{ github.sha }}. Download NGH-Companion.apk on your phone and open it to install." \
            --latest
